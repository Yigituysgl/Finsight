# Facts for the labeling fact sheets (scripts/build_factsheets.py).
#
# Each fact is a verbatim quote from the parsed filing. The build checks that it
# appears on exactly one distinct line of the given Item (and of the given
# primary statement, if one is named), and reads `value` out of the quote.
# Ratios are computed from those values; a numerator term starting with "-"
# is subtracted. Units: "millions" or "billions" of dollars, or "percent".
# topic: "scale", "fx" or "interest_rate".

