# Pinned 10-K filings. Results stay reproducible when newer filings
# appear; change a pin deliberately (see `python src/fetch_filings.py --list`).
# fiscal_year is the year the 10-K covers; period_end is the fiscal year end.
# revenue_line, operating_income_line and net_income_line name the income-statement
# rows used as scale context in risk scoring, exactly as the parsed statement labels
# them; net income is the line attributable to the company itself.

